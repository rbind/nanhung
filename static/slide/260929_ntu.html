<h3 id="what-is-a-pesticide">What Is a Pesticide?</h3>
<p>The term &quot;pesticide&quot; means</p>
<ul>
<li>
<p>any substance or mixture of substances intended for</p>
<ul>
<li>
<p>preventing, destroying, repelling, or mitigating any pest.</p>
</li>
<li>
<p>use as a plant regulator, defoliant, or desiccant</p>
</li>
</ul>
</li>
<li>
<p>any nitrogen stabilizer</p>
</li>
</ul>
<hr />
<center>
<strong>
🪳Insecticides - 🌿Herbcides - 🍄Fungicides - 🐀Rodenticides 
</strong>
</center>
<footer>Source: <a href="https://www.govinfo.gov/content/pkg/USCODE-2013-title7/html/USCODE-2013-title7-chap6-subchapII-sec136.htm">Section 2(u) of the Federal Insecticide, Fungicide, and Rodenticide Act</a></footer>
</section>

<h3 id="first-pesticide">First Pesticide</h3>
<p>California’s first law, passed in 1901, was concerned only with preventing consumer fraud in sales of <span class="paris-green">Paris green</span>.</p>
<br />
<h3 id="first-law">First Law</h3>
<p>Until 1910, Congress passed the first federal law, <strong>Federal Insecticide Act</strong>, to regulate its sales.</p>
<footer>Image: <a href="https://pubs.acs.org/evhpaz/article/120/4/487/5241654/The-Greening-of-Pesticide-Environment-Interactions">Environ. Health Perspect. (2012) 120 (4): 487–493.</a></footer>
</section>

<p>The Food and Drug Administration has the authority to set food <strong>&quot;standards&quot;</strong>.</p>

<p>The U.S. Department of Agriculture (USDA) was required to ensure the &quot;quality and effectiveness&quot; of products.</p>

<h2 id="1972">1972</h2>
<p>Congress amended the FIFRA, requiring EPA to measure</p>
<ul>
<li>every pesticide's <strong>&quot;risks&quot;</strong> to man and environement against its potential benefits.</li>
</ul>
<p>and</p>
<ul>
<li>any human <strong>&quot;dietary risk&quot;</strong> from residues that result from use of a pesticide in or on any food inconsistent with the standard under section 408 of the FFDCA.</li>
</ul>
</section>

<h1 id="fqpa">FQPA</h1>
<p>FQPA requires EPA to find <strong>&quot;a reasonable certainty of no harm&quot;</strong>, including</p>
<ul>
<li>
<p><strong>Aggregate</strong> risk — food, water, air, and other sources</p>
</li>
<li>
<p><strong>Cumulative</strong> risk — chemicals sharing a common mechanism of toxicity</p>
</li>
<li>
<p>Extra protection for <strong>infants and children</strong></p>
</li>
</ul>
</section>

<p><img class="emoji" draggable="false" alt="🇺🇸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f1fa-1f1f8.svg" data-marp-twemoji=""/> USDA Pesticide Data Program (1991–)</p>
<p><img class="emoji" draggable="false" alt="🐻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f43b.svg" data-marp-twemoji=""/> CDPR California Pesticide Residue Monitoring Program (2003–)</p>

<h2 id="usda-pesticide-data-program">USDA Pesticide Data Program</h2>
<ul>
<li>
<p>For <strong>consumer exposure assessment only</strong></p>
<p><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> Focuses on pesticides used on the selected commodities, including pesticides without U.S. tolerances but used abroad on imported products.</p>
<p><img class="emoji" draggable="false" alt="🛒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6d2.svg" data-marp-twemoji=""/> Samples are taken closer to the point of consumer purchase and are prepared the way consumers use them.</p>
<p><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Laboratories focus on detecting very low pesticide residue levels</p>
</li>

<footer>Source: <a href="https://www.ams.usda.gov/datasets/pdp/pdpdata">PDP Databases and Annual Summaries</a></footer>

<li>
<p>Enforces <strong>tolerances</strong> on imported &amp; domestic products</p>
</li>
<li>
<p>Targeted sampling</p>
<ul>
<li>consumption frequency</li>
<li>violation history</li>
</ul>
</li>
<li>
<p>Also runs the <strong>Total Diet Study</strong></p>
</li>
</ul>
<footer>Source: <a href="https://www.fda.gov/food/pesticides/pesticide-residue-monitoring-report-and-data-fy-2023">Pesticide Residue Monitoring Report and Data for FY 2023</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="en-US" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="california-pesticide-residue-monitoring-program">California Pesticide Residue Monitoring Program</h2>
<p>CDPR focuses on sampling high-risk commodities:</p>
<ul>
<li>Highly consumed by <strong>infants &amp; children</strong></li>
<li>Treated with <strong>Prop 65</strong>-listed carcinogens/reproductive toxins</li>
<li>Reflective of ethnic &amp; socioeconomic consumption patterns</li>
<li>History of illegal residues (commodity or origin)</li>
</ul>
<footer>Source: <a href="https://www.cdpr.ca.gov/wp-content/uploads/2025/07/2023california_pesticide_residue_monitoring_program_report.pdf">California Pesticide Residue Monitoring Annual Report</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="en-US" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h1 id="dietary-exposure-assessment">Dietary Exposure Assessment</h1>
<h3 id="the-basic-model">The basic model</h3>
<p><span class="paris-green">Pesticide Ingested = Residue Concentration x Foods Consumed</span></p>
<hr />
<p><strong>Children vs. Adults</strong></p>
<p><img class="emoji" draggable="false" alt="🧑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d1.svg" data-marp-twemoji=""/> 60 kg adult, 60 g apple/day → <strong>1 g/kg</strong></p>
<p><img class="emoji" draggable="false" alt="🧒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d2.svg" data-marp-twemoji=""/> 20 kg child, 60 g apple/day → <strong>3 g/kg</strong></p>
<p>! Same intake, 3× the exposure per body weight</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="en-US" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="acute--chronic-exposure">Acute &amp; Chronic Exposure</h2>
<p><strong>Acute</strong> — extreme exposure scenario</p>
<p>Tier 1: Tolerance</p>
<p>Tier 2: Max detect</p>
<br />
<p><strong>Chronic</strong> — mean consumption × mean residue</p>
<p>Tier 3: Mean or ½ LOD</p>
