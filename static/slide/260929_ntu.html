<h3 id="what-is-a-pesticide">What Is a Pesticide?</h3>
<p>The term &quot;pesticide&quot; means</p>
<ul>
<li>
<p>any substance or mixture of substances intended for</p>
<ul>
<li>
<p>preventing, destroying, repelling, or mitigating any pest.</p>
</li>
<li>
<p>use as a plant regulator, defoliant, or desiccant</p>
</li>
</ul>
</li>
<li>
<p>any nitrogen stabilizer</p>
</li>
</ul>
<hr />
<center>
<strong>
🪳Insecticides - 🌿Herbcides - 🍄Fungicides - 🐀Rodenticides 
</strong>
</center>

<h3 id="first-pesticide">First Pesticide</h3>

<h2 id="1972">1972</h2>
<p>Congress amended the FIFRA, requiring EPA to measure</p>
<ul>
<li>every pesticide's <strong>&quot;risks&quot;</strong> to man and environement against its potential benefits.</li>
</ul>
<p>and</p>
<ul>
<li>any human <strong>&quot;dietary risk&quot;</strong> from residues that result from use of a pesticide in or on any food inconsistent with the standard under section 408 of the FFDCA.</li>
</ul>

<h1 id="fqpa">FQPA</h1>
<p>FQPA requires EPA to find <strong>&quot;a reasonable certainty of no harm&quot;</strong>, including</p>
<ul>
<li>
<p><strong>Aggregate</strong> risk — food, water, air, and other sources</p>
</li>
<li>
<p><strong>Cumulative</strong> risk — chemicals sharing a common mechanism of toxicity</p>
</li>
<li>
<p>Extra protection for <strong>infants and children</strong></p>
</li>
</ul>
</section>

<h2 id="us-fda-residue-monitoring-program">US FDA Residue Monitoring Program</h2>
<ul>
<li>
<p>Enforces <strong>tolerances</strong> on imported &amp; domestic products</p>
</li>
<li>
<p>Targeted sampling</p>
<ul>
<li>consumption frequency</li>
<li>violation history</li>
</ul>
</li>
<li>
<p>Also runs the <strong>Total Diet Study</strong> (~800 contaminants monitored)</p>
</li>
</ul>
<footer>Source: <a href="https://www.fda.gov/food/pesticides/pesticide-residue-monitoring-report-and-data-fy-2023">Pesticide Residue Monitoring Report and Data for FY 2023</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-footer="Source: [California Pesticide Residue Monitoring Annual Report](https://www.cdpr.ca.gov/wp-content/uploads/2025/07/2023california_pesticide_residue_monitoring_program_report.pdf)" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--footer:Source: [California Pesticide Residue Monitoring Annual Report](https://www.cdpr.ca.gov/wp-content/uploads/2025/07/2023california_pesticide_residue_monitoring_program_report.pdf);--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="california-pesticide-residue-monitoring-program">California Pesticide Residue Monitoring Program</h2>
<p>CDPR focuses on sampling high-risk commodities:</p>
<ul>
<li>Highly consumed by infants &amp; children</li>
<li>Treated with Prop 65-listed carcinogens/reproductive toxins</li>
<li>Reflective of ethnic &amp; socioeconomic consumption patterns</li>
<li>History of illegal residues (commodity or origin)</li>
</ul>
<footer>Source: <a href="https://www.cdpr.ca.gov/wp-content/uploads/2025/07/2023california_pesticide_residue_monitoring_program_report.pdf">California Pesticide Residue Monitoring Annual Report</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h1 id="dietary-exposure-assessment">Dietary Exposure Assessment</h1>
<h3 id="the-basic-model">The basic model</h3>
<p><span class="paris-green">Pesticide Ingested = Residue Concentration x Foods Consumed</span></p>
<hr />
<p><strong>Children vs. Adults</strong></p>
<p><img class="emoji" draggable="false" alt="🧑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d1.svg" data-marp-twemoji=""/> 60 kg adult, 60 g apple/day → <strong>1 g/kg</strong></p>
<p><img class="emoji" draggable="false" alt="🧒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d2.svg" data-marp-twemoji=""/> 20 kg child, 60 g apple/day → <strong>3 g/kg</strong></p>
<p>! Same intake, 3× the exposure per body weight</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="acute--chronic-exposure">Acute &amp; Chronic Exposure</h2>
<p><strong>Acute</strong> — extreme exposure scenario</p>
<p>Tier 1: Tolerance</p>
<p>Tier 2: Max detect</p>
<br />
<p><strong>Chronic</strong> — mean consumption × mean residue</p>
<p>Tier 3: Mean or ½ LOD</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="food-consumption-database">Food Consumption Database</h2>
<p><img class="emoji" draggable="false" alt="🍕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f355.svg" data-marp-twemoji=""/> <strong>Continuing Survey of Food Intakes by Individuals (CSFII, USDA)</strong><br />
1989–91, 1994–96, 1998</p>
<p><img class="emoji" draggable="false" alt="🍕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f355.svg" data-marp-twemoji=""/> <strong>What We Eat In America (WWEIA, CDC)</strong><br />
1999–</p>
<p><img class="emoji" draggable="false" alt="🧀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9c0.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🍅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f345.svg" data-marp-twemoji=""/> <strong>Food Commodity Intake Database (FCID, EPA)</strong><br />
Convert reported food consumption into food commodity intakes</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-footer="DEEM-FCID -Dietary Exposure Evaluation Model - Food Commodity Intake Database &lt;br&gt; DEEM-FCID -Dietary Exposure Evaluation Model - Food Commodity Intake Database" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--footer:DEEM-FCID -Dietary Exposure Evaluation Model - Food Commodity Intake Database &lt;br&gt; DEEM-FCID -Dietary Exposure Evaluation Model - Food Commodity Intake Database;--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="exposure-assessment">Exposure Assessment</h2>
<p><strong>Deterministic</strong></p>
<p>— regulatory tolerance decisions</p>
<p><strong>Stochastic</strong></p>
<p>— exposure distribution, biomonitoring comparison</p>
<p>Neither is &quot;more correct&quot; — the tiered framework matches refinement to the decision</p>
<footer>DEEM-FCID -Dietary Exposure Evaluation Model - Food Commodity Intake Database <br /> DEEM-FCID -Dietary Exposure Evaluation Model - Food Commodity Intake Database</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
<h2 id="exposure-models">Exposure Models</h2>
<p><strong>Deterministic</strong></p>
<ul>
<li>DEEM-FCID — regulatory workhorse for dietary assessment used by both EPA and CDPR</li>
</ul>
<p><strong>Stochastic</strong></p>
<ul>
<li>SHEDS — simulates a population of individuals (activity, body weight, diet, etc.,)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-theme="gaia" lang="C" style="--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--theme:gaia;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;">
